<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="Arthur+Codex">
<meta name="created" content="2026-11-05">
<meta name="project" content="nylon-wiki">
<title>尼龙 Wiki · 公开的战术尼龙装备知识库</title>
<style>
:root{
  --bg:#16181d; --panel:#1e2128; --panel2:#242832; --line:#333845;
  --text:#d8dce3; --dim:#8b92a0; --accent:#e8a33d; --accent-dim:#a06a1e;
  --link:#7ab0e8; --cat:#7ab0e8; --ok:#6fbf73;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font:15px/1.75 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
.app{display:flex;min-height:100vh}

/* ---- 侧栏树 ---- */
.side{width:280px;flex:none;background:var(--panel);border-right:1px solid var(--line);height:100vh;position:sticky;top:0;overflow-y:auto;z-index:30;display:flex;flex-direction:column}
.brand{padding:18px 16px 12px;border-bottom:1px solid var(--line)}
.brand a{font-size:17px;font-weight:700;color:var(--accent);letter-spacing:1px}
.brand-sub{color:var(--dim);font-size:11px;margin-top:3px}
nav{flex:1;padding:6px 10px 16px;font-size:13px}
nav .grp{margin:14px 0 3px;color:var(--dim);font-size:10.5px;letter-spacing:2px;text-transform:uppercase;padding:0 9px}
nav details{margin:2px 0}
nav summary{cursor:pointer;padding:6px 9px;border-radius:6px;color:var(--text);list-style:none;display:flex;justify-content:space-between;align-items:center}
nav summary::-webkit-details-marker{display:none}
nav summary:hover{background:var(--panel2)}
nav summary .n{color:var(--dim);font-size:10.5px;border:1px solid var(--line);border-radius:8px;padding:0 7px;line-height:15px}
nav details .body{padding-left:9px;border-left:1px solid var(--line);margin:0 0 0 10px}
nav a.row{display:block;padding:5px 9px;border-radius:6px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav a.row:hover{background:var(--panel2);text-decoration:none}
nav a.row.on{background:var(--accent-dim);color:#fff}
.side-foot{padding:12px 16px 20px;border-top:1px solid var(--line);color:var(--dim);font-size:11px;line-height:1.7}
.side-foot a{color:var(--dim)}

/* ---- 主区 ---- */
main{flex:1;min-width:0}
.topbar{position:sticky;top:0;background:rgba(22,24,29,.96);border-bottom:1px solid var(--line);padding:10px 26px;display:flex;gap:14px;align-items:center;z-index:20}
#menuBtn{display:none;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:15px}
#crumb{font-size:12.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#crumb a{color:var(--dim)}
#crumb a:hover{color:var(--link)}
.tsearch{position:relative;margin-left:auto;width:min(360px,44vw)}
.tsearch input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:7px 12px;border-radius:7px;font-size:13px;outline:none;font-family:inherit}
.tsearch input:focus{border-color:var(--accent)}
#suggest{display:none;position:absolute;top:40px;left:0;right:0;background:var(--panel2);border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 32px rgba(0,0,0,.5);max-height:330px;overflow-y:auto;z-index:40}
#suggest.show{display:block}
#suggest a{display:block;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--text)}
#suggest a:hover,#suggest a.sel{background:rgba(232,163,61,.12);text-decoration:none}
#suggest .s-t{font-weight:600}
#suggest .s-k{display:inline-block;color:var(--dim);font-size:10.5px;border:1px solid var(--line);border-radius:4px;padding:0 6px;margin-left:7px;line-height:15px}
#suggest .s-d{display:block;color:var(--dim);font-size:11.5px;margin-top:2px}
#suggest .s-none{padding:10px 12px;color:var(--dim);font-size:12px}

#page{max-width:920px;margin:0 auto;padding:22px 30px 90px}

/* ---- 通用词条结构 ---- */
.breadcrumb{font-size:13px;color:var(--dim);margin-bottom:6px}
.breadcrumb a{color:var(--dim)}
h1.entry-title{font-size:27px;font-weight:650;padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:6px}
.entry-meta{font-size:12.5px;color:var(--dim);margin-bottom:14px}
.entry-meta .tag{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:0 8px;margin-right:5px;font-size:11.5px}
.toc{background:var(--panel);border:1px solid var(--line);border-radius:6px;display:table;padding:9px 16px;margin:14px 0 18px}
.toc .toc-head{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:12px}
.toc .toggle{color:var(--link);font-size:12.5px;cursor:pointer;font-weight:400}
.toc ul{list-style:none;margin-top:5px}
.toc li{margin:2px 0;font-size:13.5px}
.toc li.lv3{padding-left:19px;font-size:13px}
.toc .no{color:var(--dim);margin-right:6px}
.toc.collapsed ul{display:none}

#body h2{font-size:21px;font-weight:620;margin:30px 0 11px;padding-bottom:4px;border-bottom:1px solid var(--line)}
#body h3{font-size:17.5px;font-weight:600;margin:22px 0 9px}
#body p{margin:11px 0}
#body ul,#body ol{margin:11px 0 11px 26px}
#body li{margin:5px 0}
#body b{color:var(--accent)}
#body table{border-collapse:collapse;width:100%;margin:13px 0;font-size:14px}
#body th{background:var(--panel2);text-align:left;font-weight:600}
#body th,#body td{border:1px solid var(--line);padding:7px 12px;vertical-align:top}
#body tr:nth-child(even) td{background:var(--panel)}
#body .todo{background:rgba(232,163,61,.08);border:1px dashed var(--accent);padding:9px 14px;border-radius:6px;margin:13px 0;font-size:13.5px}
#body .empty{color:var(--dim);text-align:center;padding:12px}

/* 参见块 */
.see-also{margin-top:30px;border-top:1px solid var(--line);padding-top:10px}
.see-also h3{font-size:13px;color:var(--dim);letter-spacing:1.5px;font-weight:600;margin-bottom:6px}
.see-also ul{list-style:none}
.see-also li{margin:6px 0;font-size:14px}
.see-also .sa-d{color:var(--dim);font-size:12.5px;margin-left:6px}

/* ---- 首页 ---- */
.hero{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:20px 24px;margin:14px 0 20px}
.hero h1{font-size:24px;margin-bottom:6px}
.hero p{color:var(--dim);font-size:14px;max-width:660px}
.path-section{margin:18px 0 22px}
.path-section h2{font-size:18px;border-bottom:1px solid var(--line);padding-bottom:5px;margin-bottom:10px}
.path-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:11px}
.path-card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.path-card h3{font-size:14.5px;margin-bottom:3px}
.path-card p{font-size:13px;color:var(--dim);margin:6px 0;line-height:1.65}
.path-card p b{color:var(--accent)}

/* 总览矩阵表 */
.matrix{border-collapse:collapse;width:100%;font-size:13.5px;margin:10px 0 30px}
.matrix th{background:var(--panel2);text-align:left;font-weight:600}
.matrix th,.matrix td{border:1px solid var(--line);padding:7px 11px;vertical-align:top}
.matrix tr.cat td{background:var(--panel);color:var(--accent);font-weight:650;letter-spacing:1px}
.matrix td.t a{font-weight:600}
.matrix .tags{color:var(--dim);font-size:11.5px}
.matrix .desc{color:var(--dim)}
.matrix .upd{color:var(--dim);white-space:nowrap}

/* ---- 搜索 ---- */
.result-item{padding:12px 0;border-bottom:1px solid var(--line)}
.result-item a{font-size:16.5px;font-weight:600}
.result-item .snippet{font-size:13px;color:var(--dim);margin-top:3px}
mark{background:var(--accent);color:#111;border-radius:2px;padding:0 2px}

/* ---- 编辑页 ---- */
.edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.edit-form label{display:block;font-size:13px;color:var(--dim);margin:12px 0 4px}
.edit-form input,.edit-form select,.edit-form textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--text);font-size:14px;outline:none;font-family:inherit}
.edit-form textarea{min-height:210px;font-family:Consolas,Menlo,monospace;font-size:13px;resize:vertical;line-height:1.6}
.edit-form input:focus,.edit-form select:focus,.edit-form textarea:focus{border-color:var(--link)}
.edit-actions{display:flex;gap:8px;margin-top:14px}
.edit-actions button{padding:8px 16px;border:1px solid var(--line);border-radius:4px;background:var(--panel2);color:var(--text);cursor:pointer;font-size:14px}
.edit-actions button.primary{border-color:var(--accent);color:var(--accent);font-weight:600}
.edit-actions button:hover{filter:brightness(1.25)}
.export-box{margin-top:16px}
.export-box label{font-size:13px;color:var(--dim);display:block;margin-bottom:4px}
.export-box textarea{width:100%;min-height:170px;font-family:Consolas,Menlo,monospace;font-size:12px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:4px;padding:10px;resize:vertical;line-height:1.5}
.note{font-size:13px;color:var(--dim);background:var(--panel);border:1px dashed var(--line);border-radius:6px;padding:10px 14px;margin:12px 0 16px;line-height:1.8}
.note b{color:var(--accent)}

footer.pg-foot{border-top:1px solid var(--line);margin-top:44px;padding:14px 0 6px;font-size:12px;color:var(--dim)}
footer.pg-foot a{color:var(--dim)}

@media (max-width:900px){
  .side{position:fixed;left:-290px;transition:left .2s;box-shadow:0 0 40px rgba(0,0,0,.6)}
  .side.open{left:0}
  #menuBtn{display:block}
  #page{padding:16px 14px 70px}
  .topbar{padding:9px 12px}
  .tsearch{width:min(240px,42vw)}
  .edit-grid{grid-template-columns:1fr}
  #suggest .s-d{display:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><a href="#home">尼龙 Wiki</a><div class="brand-sub">公开的战术尼龙装备知识库</div></div>
    <nav id="tree"></nav>
    <div class="side-foot" id="side-foot"></div>
  </aside>
  <main>
    <div class="topbar">
      <button id="menuBtn">☰</button>
      <div id="crumb"></div>
      <div class="tsearch">
        <input id="q" type="text" placeholder="搜索词条 / 标签 / 简介…" autocomplete="off">
        <div id="suggest"></div>
      </div>
    </div>
    <div id="page"></div>
  </main>
</div>

    { id: "brands", name: "品牌导航", entries: ["brands"] }
  ],
  entries: [

    // ===== 入门 =====
    {
      id: "newbie-guide",
      title: "新手入门指南",
      tags: ["入门", "指南"],
      desc: "三问定向 + 预算档位 + 通用采购原则",
      see: ["glossary","ronin-belt","cos-overview","self-overview","airsoft-overview"],
      updated: "2026-11-05",
      body: [
        "<h2>按身份快速进</h2>",
        "<table><tr><th>你的状态</th><th>建议路径</th></tr>",
        "<tr><td>纯围观，想看懂这圈子在玩什么</td><td>「术语表」→ 三大流派三连（还原 / 自设 / 竞技），不用买任何东西</td></tr>",
        "<tr><td>准备入坑，要买第一件装备</td><td>本词条「三问定向」+ 预算档位表 → 「浪人腰带（内外腰带）」</td></tr>",
        "<tr><td>已有方向（造型 or 下场）</td><td>直接进对应流派词条，再按其方法采购</td></tr>",
        "<tr><td>老手查细节</td><td>顶部搜索，或进「材质与工艺」「保养与交易」分区</td></tr></table>",
        "<h2>先回答三个问题</h2>",
        "<ol>",
        "<li><b>想干什么</b>：日常 EDC 穿用？拍照造型？还是下场实战？——这决定你走哪条流派路线（见「三大流派」）。</li>",
        "<li><b>预算多少</b>：尼龙装备丰俭由人，先定总预算再定采购顺序，避免买一半钱花完了骨架还没着落。</li>",

        "</ol>",
        "<h2>通用采购原则</h2>",
        "<ul>",
        "<li><b>先骨架后挂载</b>：背心/腰带/腰封是骨架，挂包是小件。差的骨架拖累整体，便宜的挂载件不拖累任何东西。</li>",
        "<li><b>单品试水</b>：不熟的厂牌先买小件（腰带、杂味包）验证做工，再上大件。</li>",
        "<li><b>不追联名限量</b>：尼龙装备是工具属性，同性能优先低价；工装款二手折价大，买新不如淘旧。</li>",
        "</ul>",
        "<h2>预算档位参考</h2>",
        "<table><tr><th>档位</th><th>能买到什么</th><th>适合</th></tr>",
        "<tr><td>¥300 内</td><td>入门战术腰带 + 杂味包 + 速干裤</td><td>EDC 试水，确认自己是否真感兴趣</td></tr>",
        "<tr><td>¥1000 内</td><td>一件像样的骨架（腰带/胸挂）+ 3–4 个挂件</td><td>轻度造型、日常挂载</td></tr>",

        "<p class='todo'>社区贡献：欢迎补充各价位具体推荐单品（附购买渠道与价格）。</p>"

    {
      id: "glossary",
      title: "术语表",
      tags: ["术语", "黑话"],
      desc: "结构与部件、圈子用语、色彩缩写速查",
      see: ["molle","ronin-belt"],
      updated: "2026-11-05",
      body: [
        "<h2>结构与部件</h2>",
        "<table><tr><th>术语</th><th>释义</th></tr>",
        "<tr><td>承载层 / 骨架</td><td>腰带、腰封、胸挂、背心这类直接挂装备的主体</td></tr>",
        "<tr><td>挂载件</td><td>挂在骨架上的包、套、袋</td></tr>",
        "<tr><td>内外腰带</td><td>内腰带穿裤耳，外腰带承载挂载，两根分离不互相拖拽；浪人腰带即主流实现</td></tr>",

        "<tr><td>PC / Plate Carrier</td><td>携板背心，插防弹板位（下场/造型多为插假板撑形）</td></tr>",
        "<tr><td>JPC</td><td>Jumpable Plate Carrier 经典轻量背心板型，复刻极多</td></tr>",
        "<tr><td>打枣 / bartack</td><td>受力点的高密度缝纫加固，军规标配，识别做工的关键</td></tr>",
        "<tr><td>MOLLE / PALS</td><td>格阵织带挂载标准，详见「MOLLE 与挂载系统」</td></tr></table>",
        "<h2>圈子用语</h2>",
        "<table><tr><th>术语</th><th>释义</th></tr>",

        "<tr><td>真兵版 / 原品</td><td>实际列装或原厂出品的装备</td></tr>",
        "<tr><td>复刻</td><td>按原版型仿制的装备，还原党主力来源</td></tr>",
        "<tr><td>样子货</td><td>只有外观没有功能的件，还原党可接受、竞技党勿碰</td></tr>",
        "<tr><td>缝合怪</td><td>不同体系/时代的件乱混搭，整体感崩掉</td></tr>",
        "<tr><td>下场</td><td>参加 WarGame 对抗（国内以水弹/软弹场地为主）</td></tr>",

    // ===== 材质与工艺 =====

      updated: "2026-11-05",
      body: [
"<h2>先把名字和规矩说清楚</h2>",
"<p><b>CAG</b>（Combat Applications Group，战斗应用大队）是 1st SFOD-D 的正式代号，即俗称的<b>三角洲部队</b>（Delta / The Unit / ACE）。中文圈流传的「CAT＝危机行动组」只是别称讹传；真正的 USSS CAT 是另一个单位，见 <a href='#cat-analysis'>特勤局反突击队</a>。</p>",
"<p class='note'><b>本站规矩（重要）</b>：真兵搭配一律以一手考证为准——<a href='https://www.junpin360.com/' target='_blank' rel='noopener'>战甲网（junpin360.com）</a> 与圈内实物收藏考证帖。网上流传的图注错标极多，同一张图常被安到三四个单位头上；<b>用图前先核对原始出处，核不到就不写</b>。</p>",
"<h2>四个分水岭（这是三角洲最容易搞错的地方）</h2>",
"<table><tr><th>时期</th><th>装具主线</th><th>判断依据</th></tr>",
"<tr><td>1990s（含摩加迪沙）</td><td><b>AWS</b> 装具，四色丛林</td><td>三角洲长期是 AWS 的铁杆用户，不是这十几年才换的「Eagle 一类」</td></tr>",
"<tr><td>2003 起</td><td><b>Paraclete（圣灵）SG 烟绿色</b>，2003 年款为 <b>MTV</b>（简化版 RAV）</td><td>从 AWS 转圣灵是第一个分水岭；圣灵标签有一代（细体大字、区号 103）、二代（粗体、区号 106）之别，是收藏圈判真伪的硬依据</td></tr>",
"<tr><td>2006 起</td><td><b>Crye Precision MC（Multicam）</b></td><td>第二个分水岭，比很多人以为的「2010 年代才换迷彩」要早</td></tr>",
"<tr><td>近现役</td><td>Ops-Core 高切盔 + JPC 2.0 / AVS + MRB 1.0 腰带 + HK416D</td><td>GSGM 夜视支架是 CAG 特色，且<b>盔上打四孔直装，不用墨鱼干</b></td></tr></table>",
"<p class='note'>常见错误（也是本站之前的错误，已订正）：把近现役三角洲的长枪写成「416 或 URG-I」。URG-I 是 USASOC 给常规特战的 M4A1 升级套件，不是 CAG 的路线；CAG 的招牌是沙色阳极 HK416D（Geissele SMR、Wilcox 增高、LA5、Surefire 一套）。</p>",
"<figure style='margin:14px 0'>",
"<img src='https://upload.wikimedia.org/wikipedia/commons/b/bd/DeltaSBSTora.jpg' alt='真兵参考图' loading='lazy' style='max-width:100%;border-radius:6px;border:1px solid rgba(255,255,255,.14);display:block'>",
"<figcaption style='font-size:12px;line-height:1.6;color:#9a9a9a;margin-top:6px'>2001 年托拉博拉山区，三角洲与英国 SBS 及当地武装的合影。现场几乎看不到头盔与制式装具——这就是阿富汗初期「低可视便装化」的样子，靠气质不靠件。人脸已做模糊处理 · 图源：<a href='https://upload.wikimedia.org/wikipedia/commons/b/bd/DeltaSBSTora.jpg' target='_blank' rel='noopener'>Wikimedia Commons</a>（Public domain）</figcaption>",
"</figure>",
"<h2>2001 阿富汗：便装化不是「随便穿」</h2>",
"<p>托拉博拉期的特征是<b>民用衣物为主体、军版件为辅</b>，多为奔尼帽/棒球帽，胸挂而非硬质背心。还原难点不在买什么，而在「像不像在那儿待过」——堆满军版反而假。具体单品品牌旧照难考，别硬编型号。</p>",
"<figure style='margin:14px 0'>",
"<img src='https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5f/Airborne_and_Special_Forces_Uday-Qusay_raid%2C_2003.jpg/960px-Airborne_and_Special_Forces_Uday-Qusay_raid%2C_2003.jpg' alt='真兵参考图' loading='lazy' style='max-width:100%;border-radius:6px;border:1px solid rgba(255,255,255,.14);display:block'>",
"<figcaption style='font-size:12px;line-height:1.6;color:#9a9a9a;margin-top:6px'><b>辨伪示例</b>：这张 2003 年摩苏尔行动现场照在网上常被标成「三角洲参考」，但画面里成排的是戴 PASGT/ACH 全耳罩盔、穿四色丛林 BDU 与丛林迷彩防弹衣的<b>常规部队</b>。拿它配三角洲的装，方向就全错了 · 图源：<a href='https://upload.wikimedia.org/wikipedia/commons/5/5f/Airborne_and_Special_Forces_Uday-Qusay_raid%2C_2003.jpg' target='_blank' rel='noopener'>Wikimedia Commons</a>（Public domain）</figcaption>",
"</figure>",
"<h2>2003 伊拉克：圣灵烟绿登场</h2>",
"<p>伊拉克战争开始后，三角洲从 AWS 四色丛林整体转向 <b>Paraclete（中文圈叫「圣灵」）SG 烟绿色</b>装具，2003 年款核心是 <b>MTV（简化版 RAV）</b>。这是识别 2003–2005 三角洲最强的一件东西，也是复刻市场最难做对的（颜色偏绿偏灰一步就露馅）。</p>",
"<h2>2004 费卢杰：现代导轨盔的雏形</h2>",
"<p>圈内考证的关键一例：2004 年费卢杰，三角洲 A 队狙击手 Jamey Caldwell 把 <b>MSA MICH 2002</b> 自改，装上 Peltor 3M 支架整合 COMTAC 1 耳机——这顶自改盔被公认为后来 FAST 一类导轨盔的<b>鼻祖</b>；同期队长 Tom Spooner 的造型也是收藏圈的还原标杆。同期服装是 Crye GEN1.5 三沙（不是公发 DCU 那么简单）。</p>",
"<h2>2006 起：Crye 迷彩与近现役</h2>",
"<p>2006 年转 Crye MC 色装具，形成今天看到的「Multicam + 高切盔 + 轻量载具」主线。近现役要素：Ops-Core 高切（FTHS/FAST）、GSGM 夜视支架四孔直装、JPC 2.0 / AVS、MRB 1.0 腰带、沙色 HK416D。四眼夜视（GPNVG）在三角洲确有使用，但属高价件，复刻件的光学素质与形制差距明显，别把复刻当原品炫耀。</p>",
"<h2>还原建议</h2>",
"<ul><li><b>先选时期，再买件</b>：AWS（90s）/ 圣灵烟绿（03–05）/ Crye MC（06 后）/ 现代高切，四套几乎不通用。</li><li><b>抓一件硬标志物</b>：圣灵烟绿 MTV、自改 MICH 2002、GSGM 四孔盔——一件就能定性。</li><li><b>混穿不等于乱穿</b>：CAG 自由度大，但配色逻辑与年代逻辑不能破。</li><li><b>不伪造标识</b>：不佩戴现役单位臂章，不当自己是兵。</li></ul>",
"<h2>资料来源</h2>",
"<ul><li>战甲网（junpin360.com）：军品资料与装备考证主源，本站真兵搭配一律以此为准。</li><li>圈内实物考证长文《2003 年之后的三角洲特种部队造型装备收藏总结》（SEALS天）：圣灵标签断代、2003 MTV、2004 费卢杰自改盔、2006 转 Crye 的划分依据。</li><li>图片均为美军官方公有领域照片（Wikimedia Commons）。</li></ul>",
      ].join("")
    },

"<h2>它到底是谁</h2>",
"<p>USSS CAT（United States Secret Service — Counter Assault Team）隶属美国特勤局，是总统护卫体系里的<b>火力反应单位</b>：护卫分队遇袭时负责压制与掩护撤离。它与三角洲没有任何隶属关系，中文圈把三角洲叫「CAT（危机行动组）」是讹传，见 <a href='#cag-analysis'>CAG 词条</a>。</p>",
"<p class='note'><b>本词条暂缺合格真兵图</b>。Wikimedia Commons 上以「USSS CAT」为名的照片多为车队与外围画面，看不到装具细节，拿来当造型参考会误导，故不放图。补图要求：能看清头盔/背心/武器，且能核到原始出处。</p>",

<script>
(function(){

  // ---------- 侧栏树 ----------

    });
    D.categories.forEach(function(c){
      h += "<details open><summary>"+esc(c.name)+"<span class='n'>"+c.entries.length+"</span></summary><div class='body'>";
      c.entries.forEach(function(id){
        var e = entryMap[id]; if(!e) return;
        h += "<a class='row' data-r='#"+id+"' href='#"+id+"' title='"+esc(e.title)+"'>"+esc(e.title)+"</a>";
      });
      h += "</div></details>";
    });
    tree.innerHTML = h;
    document.getElementById("side-foot").innerHTML =
      "共 " + D.entries.length + " 词条 · " + D.categories.length + " 分区<br>更新于 " + D.meta.updated +
      " · <a href='#edit'>贡献词条</a>";

  function markOn(hash){
    tree.querySelectorAll("a.row").forEach(function(a){
      a.classList.toggle("on", a.getAttribute("data-r") === hash);
    });
  }
  function setCrumb(parts){
    crumb.innerHTML = parts.map(function(p,i){
      return i === parts.length-1 ? esc(p[0]) : "<a href='"+p[1]+"'>"+esc(p[0])+"</a>";
    }).join(" › ");

  // ---------- 即输即显搜索建议 ----------
  var sugIdx = -1, sugItems = [];
  function matchEntries(q){
    q = q.toLowerCase();
    var out = [];
    D.entries.forEach(function(e){
      var m = (e.title.toLowerCase().indexOf(q)>=0) || (e.tags.join(" ").toLowerCase().indexOf(q)>=0) || ((e.desc||"").toLowerCase().indexOf(q)>=0);
      if(m) out.push(e);
    });
    return out;
  }
  function showSuggest(list, q){
    if(!q){ sug.classList.remove("show"); return; }
    var h = "";
    list.slice(0,8).forEach(function(e,i){
      var c = catOf[e.id];
      h += "<a href='#"+e.id+"'><span class='s-t'>"+hl(esc(e.title), q)+"</span><span class='s-k'>"+(c?esc(c.name):"")+"</span><span class='s-d'>"+esc(e.desc||"")+"</span></a>";
    });
    if(!list.length) h = "<div class='s-none'>无匹配，回车进全文搜索</div>";
    else if(list.length>8) h += "<div class='s-none'>其余 "+(list.length-8)+" 条，回车看全部</div>";
    sug.innerHTML = h;
    sug.classList.add("show");
    sugIdx = -1; sugItems = sug.querySelectorAll("a");
  }
  function hl(text, q){
    var re = new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","i");
    return text.replace(re,"<mark>$1</mark>");
  }
  qInput.addEventListener("input", function(){ showSuggest(matchEntries(this.value), this.value); });
  qInput.addEventListener("focus", function(){ if(this.value) showSuggest(matchEntries(this.value), this.value); });
  qInput.addEventListener("keydown", function(ev){
    if(!sug.classList.contains("show")){
      if(ev.key==="Enter" && this.value.trim()) location.hash = "search/" + encodeURIComponent(this.value.trim());
      return;
    }
    if(ev.key==="ArrowDown" || ev.key==="ArrowUp"){
      ev.preventDefault();
      sugIdx += (ev.key==="ArrowDown"?1:-1);
      if(sugIdx<0) sugIdx = sugItems.length-1;
      if(sugIdx>=sugItems.length) sugIdx = 0;
      sugItems.forEach(function(a,i){ a.classList.toggle("sel", i===sugIdx); });
      sugItems[sugIdx].scrollIntoView({block:"nearest"});
    } else if(ev.key==="Enter"){
      ev.preventDefault();
      if(sugIdx>=0 && sugItems[sugIdx]){ sugItems[sugIdx].click(); }
      else if(this.value.trim()){ location.hash = "search/" + encodeURIComponent(this.value.trim()); sug.classList.remove("show"); }
    } else if(ev.key==="Escape"){
      sug.classList.remove("show");
    }
  });

      "</div></div>";

    var h = "<table class='matrix'><tr><th>词条</th><th>标签</th><th>简介</th><th>更新</th></tr>";

  }

      "<p>给尼龙萌新、准备入坑的小白和围观者的战术尼龙装备知识库：从术语黑话到面料工艺，从买第一件装备到三大流派怎么玩。共 " + D.entries.length + " 个词条，持续建设中。</p></div>" +

      toc += "</ul></div>";
    }
    var see = (e.see||[]).map(function(sid){
      var t = entryMap[sid]; if(!t) return "";
      return "<li><a href='#"+sid+"'>"+esc(t.title)+"</a><span class='sa-d'>"+esc(t.desc||"")+"</span></li>";
    }).join("");

    page.innerHTML =
      "<div class='breadcrumb'><a href='#home'>首页</a> › "+(cat?esc(cat.name):"")+" › "+esc(e.title)+"</div>" +
      "<h1 class='entry-title'>"+esc(e.title)+"</h1>" +
      "<div class='entry-meta'>"+e.tags.map(function(t){return "<span class='tag'>"+t+"</span>";}).join("")+" 更新于 "+e.updated+"</div>" +
      toc + "<div id='body'></div>" +
      (see ? "<div class='see-also'><h3>参见</h3><ul>"+see+"</ul></div>" : "") +
      "<footer class='pg-foot'>尼龙 Wiki · 更新于 "+D.meta.updated+" · <a href='#home'>返回首页</a> · <a href='#edit'>改进本词条</a></footer>";
    document.getElementById("body").appendChild(host);

    page.querySelectorAll(".toc a").forEach(function(a){
      a.addEventListener("click", function(ev){
        ev.preventDefault();
        var t = document.getElementById(a.getAttribute("data-anchor"));
        if(t) t.scrollIntoView({behavior:"smooth"});
      });
    });
  }
  window.toggleToc = function(el){
    var toc = el.closest(".toc");
    toc.classList.toggle("collapsed");
    el.textContent = toc.classList.contains("collapsed") ? "[展开]" : "[隐藏]";
  };

  function autolink(root, self){
    var targets = D.entries.filter(function(x){ return x.id !== self.id; })
      .sort(function(a,b){ return b.title.length - a.title.length; });
    var linked = {};
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: function(n){
        if(!n.nodeValue || !n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
        var p = n.parentNode;
        if(p && (p.tagName==="A" || p.tagName==="MARK" || p.tagName==="H2" || p.tagName==="H3")) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    var nodes = [], n;
    while(n = walker.nextNode()) nodes.push(n);
    nodes.forEach(function(node){
      var text = node.nodeValue, i = 0, frag = document.createDocumentFragment(), changed = false;
      while(i < text.length){
        var hit = null;
        for(var k=0;k<targets.length;k++){
          var t = targets[k];
          if(linked[t.id]) continue;
          if(text.indexOf(t.title, i) === i){ hit = t; break; }
        }
        if(hit){
          var a = document.createElement("a");
          a.href = "#" + hit.id; a.textContent = hit.title;
          frag.appendChild(a); linked[hit.id] = true;
          i += hit.title.length; changed = true;
        } else {
          frag.appendChild(document.createTextNode(text[i])); i++;
        }
      }
      if(changed) node.parentNode.replaceChild(frag, node);
    });
  }

  // ---------- 搜索页 ----------
  function renderSearch(q){
    q = (q||"").trim();
    var results = [];
    if(q){
      var ql = q.toLowerCase();
      D.entries.forEach(function(e){
        var body = stripTags(e.body);
        var ti = e.title.toLowerCase().indexOf(ql);
        var gi = e.tags.join(" ").toLowerCase().indexOf(ql);
        var di = (e.desc||"").toLowerCase().indexOf(ql);
        var bi = body.toLowerCase().indexOf(ql);
        if(ti<0 && gi<0 && di<0 && bi<0) return;
        results.push({e:e, score:(ti>=0?4:0)+(gi>=0?2:0)+(di>=0?2:0)+(bi>=0?1:0), bi:bi, body:body});
      });
      results.sort(function(a,b){ return b.score-a.score; });
    }
    var html = "<div class='breadcrumb'><a href='#home'>首页</a> › 搜索</div>" +
      "<h1 class='entry-title'>搜索："+esc(q)+"</h1>" +
      "<div class='entry-meta'>命中 "+results.length+" 个词条</div>";
    if(!results.length) html += "<p>没有匹配结果，换个关键词试试。</p>";
    results.forEach(function(r){
      var snip = "";
      if(r.bi>=0){ var s=Math.max(0,r.bi-26); snip = "…"+esc(r.body.slice(s, r.bi+52))+"…"; }
      html += "<div class='result-item'><a href='#"+r.e.id+"'>"+esc(r.e.title)+"</a>" +
        (r.e.desc ? "<div class='snippet'>"+esc(r.e.desc)+"</div>" : "") +
        (snip ? "<div class='snippet'>"+snip+"</div>" : "") + "</div>";
    });
    page.innerHTML = html;
  }

  // ---------- 编辑页 ----------
  function renderEdit(){
    var catOpts = D.categories.map(function(c){ return "<option value='"+c.id+"'>"+c.name+"</option>"; }).join("");
    var entryOpts = "<option value=''>（新建词条）</option>" + D.entries.map(function(e){ return "<option value='"+e.id+"'>"+e.title+"</option>"; }).join("");
    page.innerHTML =
      "<div class='breadcrumb'><a href='#home'>首页</a> › 贡献词条</div>" +
      "<h1 class='entry-title'>给 Wiki 添砖加瓦</h1>" +
      "<div class='entry-meta'>我是尼龙大手子，我要给这个 wiki 添砖加瓦</div>" +
      "<div class='note'><b>贡献规则</b>：① 只写通用知识，不写个人数据；② 不确定的信息标注「待核实」；③ 正文用 HTML 片段（h2/h3/p/ul/ol/table/b），别带 script；④ 生成代码后发给维护者合并，或自己改 data.js。这是静态站，内容合并由维护者把关。</div>" +
      "<div class='edit-grid'>" +
        "<div class='edit-form'>" +
          "<label>基于已有词条修改（选了会自动填入，新建留空）</label>" +
          "<select id='ef-base'>" + entryOpts + "</select>" +
          "<label>词条标题</label><input id='ef-title' placeholder='例：腰封 harness 进阶选型'>" +
          "<label>所属分区</label><select id='ef-cat'>" + catOpts + "</select>" +
          "<label>标签（逗号分隔）</label><input id='ef-tags' placeholder='例：腰封, 进阶'>" +
          "<label>一句话简介（用于总览表与搜索建议）</label><input id='ef-desc' placeholder='例：内外双层腰封的进阶选型与避坑'>" +
          "<label>参见（相关词条 id，逗号分隔，可留空）</label><input id='ef-see' placeholder='例：ronin-belt, carry-system'>" +
          "<label>正文（HTML 片段，每行一个元素）</label>" +
          "<textarea id='ef-body' placeholder='&lt;h2&gt;小节标题&lt;/h2&gt;&#10;&lt;p&gt;内容…&lt;/p&gt;'></textarea>" +
          "<div class='edit-actions'>" +
            "<button id='ef-preview'>预览</button>" +
            "<button class='primary' id='ef-gen'>生成代码</button>" +
            "<button id='ef-copy'>复制代码</button>" +
          "</div>" +
        "</div>" +
        "<div>" +
          "<div class='toc' style='display:block;min-height:200px;padding:14px 18px' id='body'><p style='color:var(--dim)'>预览区：填完点「预览」看渲染效果</p></div>" +
          "<div class='export-box'><label>导出的词条代码（直接粘贴进 data.js 的 entries 数组）</label>" +
          "<textarea id='ef-export' readonly placeholder='点「生成代码」后出现在这里'></textarea></div>" +
        "</div>" +
      "</div>" +
      "<footer class='pg-foot'><a href='#home'>返回首页</a></footer>";

    document.getElementById("ef-base").addEventListener("change", function(){
      var e = entryMap[this.value]; if(!e) return;
      document.getElementById("ef-title").value = e.title;
      document.getElementById("ef-tags").value = e.tags.join(", ");
      document.getElementById("ef-desc").value = e.desc || "";
      document.getElementById("ef-see").value = (e.see||[]).join(", ");
      document.getElementById("ef-body").value = e.body;
      var c = catOf[e.id]; if(c) document.getElementById("ef-cat").value = c.id;
    });
    document.getElementById("ef-preview").addEventListener("click", function(){
      var raw = document.getElementById("ef-body").value;
      document.getElementById("body").innerHTML = raw || "<p style='color:var(--dim)'>（正文为空）</p>";
    });
    document.getElementById("ef-gen").addEventListener("click", function(){
      var title = document.getElementById("ef-title").value.trim() || "（未命名词条）";
      var tags = document.getElementById("ef-tags").value.split(/[,，]/).map(function(s){return s.trim();}).filter(Boolean);
      var desc = document.getElementById("ef-desc").value.trim();
      var see = document.getElementById("ef-see").value.split(/[,，]/).map(function(s){return s.trim();}).filter(Boolean);
      var body = document.getElementById("ef-body").value;
      var catId = document.getElementById("ef-cat").value;
      var catName = (D.categories.filter(function(c){return c.id===catId;})[0]||{}).name || "";
      var base = document.getElementById("ef-base").value;
      var lines = body.split(/\r?\n/).filter(function(l){ return l.trim(); })
        .map(function(l){ return "        " + JSON.stringify(l) + ","; });
      if(lines.length) lines[lines.length-1] = lines[lines.length-1].replace(/,$/, "");
      var code =
        "    // " + (base ? "修改词条：" : "新词条：") + title + "\n" +
        "    {\n" +
        "      id: " + JSON.stringify(base || "new-entry-id") + ", // " + (base ? "修改已有词条，id 保持不变" : "维护者：换成英文短横线 id") + "\n" +
        "      title: " + JSON.stringify(title) + ",\n" +
        "      tags: " + JSON.stringify(tags) + ",\n" +
        "      desc: " + JSON.stringify(desc) + ",\n" +
        "      see: " + JSON.stringify(see) + ",\n" +
        "      updated: \"" + D.meta.updated + "\",\n" +
        "      body: [\n" + lines.join("\n") + "\n      ].join(\"\")\n" +
        "    },\n" +
        "    // 别忘了把 id 挂进 categories 里「" + catName + "」分区的 entries 数组";
      document.getElementById("ef-export").value = code;
    });
    document.getElementById("ef-copy").addEventListener("click", function(){
      var ta = document.getElementById("ef-export");
      ta.select();
      try{ document.execCommand("copy"); }catch(e){}
      if(navigator.clipboard && ta.value) navigator.clipboard.writeText(ta.value);
      this.textContent = "已复制 ✓";
      var b = this; setTimeout(function(){ b.textContent = "复制代码"; }, 1500);
    });
  }

  // ---------- 路由 ----------
  function route(){
    var h = location.hash.replace(/^#/,"") || "home";
    if(h.indexOf("search/") === 0){
      renderSearch(decodeURIComponent(h.slice(7)));
      markOn("#search"); setCrumb([["首页","#home"],["搜索",""]]);
    } else if(h === "home"){
      renderHome(); markOn("#home"); setCrumb([["首页",""]]);
    } else if(h === "index"){
      renderIndex(); markOn("#index"); setCrumb([["首页","#home"],["词条总览",""]]);
    } else if(h === "edit"){
      renderEdit(); markOn("#edit"); setCrumb([["首页","#home"],["贡献词条",""]]);
    } else {
      renderEntry(h);
      var e = entryMap[h], c = e ? catOf[h] : null;
      markOn("#"+h);
      setCrumb(e ? [["首页","#home"],[c?c.name:"","#"+h],[e.title,""]] : [["首页","#home"]]);
    }
    window.scrollTo(0,0);
    sug.classList.remove("show");
    if(window.innerWidth<=900) side.classList.remove("open");
  }
  window.addEventListener("hashchange", route);
  buildTree();
  route();
})();
</script>
